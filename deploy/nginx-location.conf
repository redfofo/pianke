# Include inside the existing HTTPS server {} for this application's root domain.
# Nginx on the same host: keep the loopback upstream below and bind PLAYER_BIND_ADDRESS=127.0.0.1.
# Nginx in a container: replace proxy_pass with the reachable player service address.
location / {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth cookies, Origin, Range, WebSocket upgrades and conditional request headers pass through unchanged.
    proxy_cache off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 16k;
}
